name: Tests

# Runs the workspace tests on every push to main and on every pull request,
# on Linux, Windows and macOS. A separate lint job reports rustfmt and clippy
# results without blocking merges until the existing tree has been cleaned up,
# and an architecture job reports module dependencies the same way.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The same libraries the Linux release build needs (windowing, GL,
      # fonts); the packaging tools are left out.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # LC_ALL=C: a few tests compare English message text. The GPU-backed
      # tests are #[ignore]d and need an adapter, so they do not run here.
      - name: cargo test
        env:
          LC_ALL: C
        run: cargo test --workspace --locked

  lint:
    name: lint (informational)
    runs-on: ubuntu-22.04
    # Non-blocking until the existing tree is cleaned up. The tree currently has
    # thousands of rustfmt diffs and several clippy warnings and errors, so
    # these checks report in the log without failing the job: a job-level
    # continue-on-error still shows a red check on every pull request.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  architecture:
    name: architecture (informational)
    runs-on: ubuntu-22.04
    # Reports module dependencies that point up the layers described in
    # docs/architecture/RULES.md. On a pull request it lists only what the
    # pull request adds or removes, compared with the commit it merges into,
    # in the job summary and as warnings on the changed lines. Like the lint
    # job it never fails: the steps carry continue-on-error, and the report
    # step ignores the tool's exit code so the run shows warnings, not errors.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A pull request checks out its merge commit; its first parent is
          # the base the report compares against.
          fetch-depth: 2

      - name: Tool tests
        continue-on-error: true
        run: python3 scripts/test_arch_check.py

      - name: Upward dependencies added or removed
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          python3 scripts/arch_check.py diff "$RUNNER_TEMP/base" --markdown >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/arch_check.py diff "$RUNNER_TEMP/base" || true

      - name: Upward dependencies
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 scripts/arch_check.py report --markdown >> "$GITHUB_STEP_SUMMARY"
