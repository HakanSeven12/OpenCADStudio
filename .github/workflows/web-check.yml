name: Web build check

# The web bundle is only built when a release is published (pages.yml), so a
# desktop-only call in shared code can sit on main unnoticed until the next
# release fails at the wasm step. Type-check the web target on every change
# instead; this is a check, not a bundle build, so it stays fast.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The app and the parse worker that trunk's post-build hook compiles.
      - name: cargo check (wasm32)
        run: cargo check --locked --target wasm32-unknown-unknown -p OpenCADStudio -p ocs_web_worker
