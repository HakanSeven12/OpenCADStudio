name: Web build check

# The web bundle is only built when a release is published (pages.yml), so a
# desktop-only call in shared code can sit on main unnoticed until the next
# release fails at the wasm step. Type-check the web target on every change
# instead; this is a check, not a bundle build, so it stays fast.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The app and the parse worker that trunk's post-build hook compiles.
      - name: cargo check (wasm32)
        run: cargo check --locked --target wasm32-unknown-unknown -p OpenCADStudio -p ocs_web_worker

      - name: Install trunk
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: trunk

      - name: Read wasm-bindgen version
        id: wasm-bindgen-version
        shell: bash
        run: |
          VERSION=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' Cargo.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Build web bundle
        run: trunk build --locked --public-url /app/ --dist dist/app --html-output index.html web-app.html

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Run web and site checks
        run: |
          python3 scripts/test_site.py
          sh scripts/assemble-site.sh dist
          node scripts/test_site.cjs dist/site.js
          node scripts/test_web_clipboard.cjs
          node scripts/test_web_locales.cjs
