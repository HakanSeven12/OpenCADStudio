name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (leave empty for latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${{ github.event.release.tag_name }}}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - name: Compute package versions
        id: version
        shell: bash
        run: |
          python3 scripts/release.py versions --tag "${{ steps.resolve-tag.outputs.tag }}"

      - name: Check WINGET_TOKEN
        id: check-token
        shell: bash
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### WinGet Publish: Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "WINGET_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      - name: Publish to WinGet with run-komac
        if: steps.check-token.outputs.configured == 'true'
        uses: michidk/run-komac@v2
        with:
          args: >-
            update HakanSeven.OpenCADStudio
            --version ${{ steps.version.outputs.msi }}
            --urls
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/OpenCADStudio-${{ steps.version.outputs.tag }}-windows-x86_64-installer.msi
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/OpenCADStudio-${{ steps.version.outputs.tag }}-windows-arm64-installer.msi
            --submit
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
