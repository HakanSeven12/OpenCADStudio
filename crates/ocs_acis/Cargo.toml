[package]
name = "ocs_acis"
version = "0.1.0"
edition = "2021"
publish = false

# Conversion between the drawing's ACIS records (SAT/SAB, solid history) and
# kernel B-rep topology. It lives here, between the two, so the kernel needs no
# file format and the drawing model needs no geometry kernel.

[dependencies]
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "ec84d90b607327e189785935df9ba6e50084745e" }
ocs_geom = { path = "../ocs_geom" }
ocs_brep = { path = "../ocs_brep" }
