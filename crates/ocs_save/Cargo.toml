[package]
name = "ocs_save"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# Pure-Rust SAVE pipeline pieces shared by the app crate (native host and the
# main wasm instance) and the browser parse/serialize worker (`ocs_web_worker`),
# so the DWG/DXF byte serialization and the worker wire format each have
# exactly one implementation. No UI/app dependencies — only the codec + serde.

[lints]
workspace = true

[dependencies]
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "840feb9e8f881e30d37f70d5627e2d0e5aad4217", features = ["serde", "mline-pilot"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
