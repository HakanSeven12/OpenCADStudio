[package]
name = "ocs_solid"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# OpenCADStudio on Solidcore: its records read from and written to ACIS (SAT/SAB),
# solids rebuilt from their history, and what the app asks of Solidcore beside.

[lints]
workspace = true

[dependencies]
ocs_geom = { path = "../ocs_geom" }
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "840feb9e8f881e30d37f70d5627e2d0e5aad4217" }
solidcore = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcore.git", rev = "8d1db5092898f2f7a8e51ca631b390e8365dea5a" }
