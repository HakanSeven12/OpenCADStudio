[package]
name = "ocs_web_worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "a7577b9a8a0d4c43ba61bd33fb07b49a5b85b2d1", features = ["serde"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
# Shared save serialization + worker wire format (one implementation for both
# this worker and the app's inline fallback).
ocs_save = { path = "../ocs_save" }
sha2 = "0.11"
wasm-bindgen = "0.2"
