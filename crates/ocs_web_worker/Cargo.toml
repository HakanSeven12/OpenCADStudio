[package]
name = "ocs_web_worker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
document = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "840feb9e8f881e30d37f70d5627e2d0e5aad4217", features = ["serde"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
# Shared save serialization + worker wire format (one implementation for both
# this worker and the app's inline fallback).
ocs_save = { path = "../ocs_save" }
sha2 = "0.11"
wasm-bindgen = "0.2"
