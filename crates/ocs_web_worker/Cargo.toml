[package]
name = "ocs_web_worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
codec = { package = "opencaddocument", git = "https://github.com/HakanSeven12/opencaddocument.git", rev = "d657f94", features = ["serde"] }
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
# Shared save serialization + worker wire format (one implementation for both
# this worker and the app's inline fallback).
ocs_save = { path = "../ocs_save" }
sha2 = "0.10"
wasm-bindgen = "0.2"
