[package]
name = "plugin-template-v2"
version = "0.1.0"
edition = "2021"
description = "Example OpenCAD Studio plugin demonstrating the shared-memory DocumentReader API."
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ocs_plugin_api = { path = "../../crates/ocs_plugin_api", features = ["host"] }
# The codec types travel to the host over IPC, so any revision whose types
# have the host's wire shapes works (checked at connection, see
# `version_info::wire_schema`); the host's own pin is the safe choice.
acadrust = { package = "acadrust", git = "https://github.com/HakanSeven12/acadrust.git", rev = "24b037a" }
