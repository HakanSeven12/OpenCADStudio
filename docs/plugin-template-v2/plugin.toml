[plugin]
id = "com.example.plugin-template-v2"
name = "Plugin Template v2"
version = "0.1.0"
description = "Demonstrates read/write object round-trips with the host."
author = "Your Name"
license = "GPL-3.0-only"
repository = "your-account/your-plugin-repo"

[opencad]
# Keep in sync with the Rust manifest's `ApiVersion::CURRENT` — this is the
# pre-load gate; the runner also checks the compiled-in symbol.
api_version = 14
ribbon_order = 100
command_prefixes = [
    "COUNT_SURVEY_POINTS",
    "ADD_SURVEY_POINT",
    "MARK_FIRST_SURVEY_POINT",
    "COUNT_MARKED_SURVEY_POINTS",
]
xdata_apps = ["SURVEYMARK"]
# NOTE: the plugin's entity-class display labels (see `ENTITY_CLASSES` in
# src/lib.rs) travel on the registered manifest over IPC, not in this file —
# they only apply while the plugin is loaded, so plugin.toml (the pre-load
# discovery file) deliberately does not carry them.
